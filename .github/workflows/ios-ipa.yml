# Builds an unsigned iPhone app (.ipa) on GitHub's macOS runner.
# Sideloadly on Windows signs it with your Apple ID and installs it over USB.
name: iOS IPA (za Sideloadly)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/ios-ipa.yml'

concurrency:
  group: ios-ipa-${{ github.ref }}
  cancel-in-progress: true

# The build only reads the code; the .ipa is uploaded as a workflow artifact.
permissions:
  contents: read

jobs:
  ipa:
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      # Capacitor 8 needs a current Xcode (26+).
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install, test and build the web app
        run: |
          npm ci
          npm test
          npm run build
          npx cap sync ios

      - name: Build App.app for iPhone (unsigned)
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      # Fail here instead of on the phone: every @rpath framework the app links
      # must be embedded, and the web app must be bundled.
      - name: Verify App.app contents
        run: |
          APP=build/Build/Products/Release-iphoneos/App.app
          missing=0
          for lib in $(otool -L "$APP/App" | awk '/@rpath\//{print $1}'); do
            [ -e "$APP/Frameworks/${lib#@rpath/}" ] || { echo "::error::Not embedded: $lib"; missing=1; }
          done
          for file in public/index.html capacitor.config.json Info.plist; do
            [ -e "$APP/$file" ] || { echo "::error::Missing $file"; missing=1; }
          done
          {
            echo '### App.app'
            echo '```'
            du -sh "$APP"
            echo
            otool -L "$APP/App"
            echo
            ls -la "$APP/Frameworks" 2>/dev/null || echo "(no Frameworks folder)"
            echo
            ls "$APP/public" "$APP/public/assets"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # Short version as an annotation, visible on the run page without signing in.
          frameworks=$(ls "$APP/Frameworks" 2>/dev/null | tr '\n' ' ')
          echo "::notice title=App.app::$(du -sh "$APP" | cut -f1) · Frameworks: ${frameworks:-none} · Linked: $(otool -L "$APP/App" | awk 'NR>1{print $1}' | sed 's|.*/||' | tr '\n' ' ')"
          exit $missing

      - name: Package .ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qry MojaSvjetla.ipa Payload
          ls -lh MojaSvjetla.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: MojaSvjetla-ipa
          path: app/MojaSvjetla.ipa
          if-no-files-found: error
          retention-days: 30
